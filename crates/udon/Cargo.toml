[package]
name = "zakura-udon"
description = """
Pasta field and curve arithmetic with allocation-free FFTs
"""
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Reserved for allocating APIs; curve and FFT operations never require it.
alloc = []
# Selects larger square-root tables; see the crate-level feature documentation.
sqrt-table-large = []

[dependencies]
bento.workspace = true

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
num-bigint = "0.4"
rayon = "1.12"
spin = { version = "0.10", default-features = false, features = ["rwlock"] }
tempfile = "3"

[[bench]]
name = "field"
harness = false

[[bench]]
name = "fft"
harness = false

[[bench]]
name = "fft_strategies"
harness = false

[[bench]]
name = "curve"
harness = false

[[bench]]
name = "msm"
harness = false

[[bench]]
name = "execution"
harness = false
