[package]
name = "zakura-bento-macros"
description = "Procedural macros over bento: expansion-time constant derivation and code generation"
version = "0.1.0"
authors = ["Sean Bowe <ewillbefull@gmail.com>"]
edition = "2024"
rust-version = "1.91"
license = "MIT OR Apache-2.0"
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
bento-core = { package = "zakura-bento-core", path = "../bento-core" }

[dependencies.syn]
version = "2"
# Helpful for debugging:
# features = ["full", "extra-traits"]

[dev-dependencies]
# A dev-dependency cycle back onto the facade (legal for dev-dependencies, in
# contrast to normal ones) so the unit tests can assert the exact re-export
# paths under which consumers meet these macros; a facade rename or a dropped
# re-export fails this crate's tests instead of surfacing downstream.
bento = { package = "zakura-bento", path = "../bento" }
