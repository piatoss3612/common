[package]
name = "zakura-bento-macros"
description = """
Procedural macros over bento: expansion-time constant derivation and
code generation
"""
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
proc-macro = true
bench = false

[dependencies]
proc-macro2 = "1"
proc-macro-crate = "3"
quote = "1"
bento-core.workspace = true

[dependencies.syn]
version = "2"
features = ["full"]
# Add `extra-traits` for debugging.

[dev-dependencies]
# Tests use the facade to verify the macro re-exports seen by consumers.
# Cargo permits this development dependency cycle; see `../../docs/CRATES.md`.
bento.workspace = true
