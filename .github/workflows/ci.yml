name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install pinned toolchain
        run: rustup toolchain install
      - name: Check formatting
        run: python3 ci/check-format
      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Clippy with the default square-root tables
        run: cargo clippy -p zakura-udon --all-targets --locked -- -D warnings
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps

  test:
    name: Public test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install pinned toolchain
        run: rustup toolchain install
      - name: Run test suite (all workspace crates, all features)
        run: cargo test --release --locked --workspace --all-features
      - name: Check Udon with the default square-root tables
        run: cargo test --release --locked -p zakura-udon
      - name: Run Udon compiler and artifact consumers (slow)
        # Each consumer selects its own dependency feature matrix.
        run: >-
          cargo test --release --locked -p zakura-udon
          --test embedding --test fft_embedding
          --test curve_constants --test curve_embedding --test api_boundaries -- --ignored
      - name: Check arithmetic and FFTs with debug assertions
        run: |
          cargo test --locked -p zakura-udon --lib
          cargo test --locked -p zakura-udon --lib --all-features
      - name: Exercise field benchmarks
        run: |
          cargo bench --locked -p zakura-udon --bench field -- --test
          cargo bench --locked -p zakura-udon --bench field --features sqrt-table-large -- --test
      - name: Exercise FFT benchmarks
        run: |
          cargo bench --locked -p zakura-udon --bench fft -- --test
          cargo bench --locked -p zakura-udon --bench fft_strategies -- --test
      - name: Exercise curve benchmarks
        run: |
          cargo bench --locked -p zakura-udon --bench curve -- --test
          cargo bench --locked -p zakura-udon --bench curve --features sqrt-table-large -- --test
          cargo bench --locked -p zakura-udon --bench msm -- --test
      - name: Exercise incremental execution benchmarks
        run: cargo bench --locked -p zakura-udon --bench execution -- --test

  miri:
    name: Unsafe storage checks
    runs-on: ubuntu-latest
    env:
      MIRI_TOOLCHAIN: nightly-2026-09-06
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Miri toolchain
        run: rustup toolchain install "$MIRI_TOOLCHAIN" --profile minimal --component miri,rust-src
      - name: Check core storage
        run: cargo +"$MIRI_TOOLCHAIN" miri test --locked -p zakura-bento-core --lib pod::
      - name: Check public storage API
        run: cargo +"$MIRI_TOOLCHAIN" miri test --locked -p zakura-bento --test pod
      - name: Check field and affine point storage
        run: cargo +"$MIRI_TOOLCHAIN" miri test --locked -p zakura-udon --test pod

  portability:
    name: Target portability contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install pinned toolchain
        run: rustup toolchain install
      - name: Install target libraries
        run: rustup target add thumbv7em-none-eabi s390x-unknown-linux-gnu
      - name: Build portable libraries and check unsupported layouts
        run: cargo test --release --locked -p zakura-bento --test portability -- --ignored
