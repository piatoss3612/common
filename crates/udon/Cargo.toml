[package]
name = "zakura-udon"
description = """
Primitive Pasta field arithmetic
"""
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Selects larger square-root tables; see the crate-level feature documentation.
sqrt-table-large = []

[dependencies]
bento.workspace = true

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
num-bigint = "0.4"
tempfile = "3"

[[bench]]
name = "field"
harness = false
