[package]
name = "zakura-bento-macros"
description = """
Procedural macros over bento: expansion-time constant derivation and
code generation
"""
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
proc-macro = true
bench = false

[dependencies]
proc-macro2 = "1"
proc-macro-crate = "3"
quote = "1"
bento-core.workspace = true

[dependencies.syn]
version = "2"
features = ["full"]
# Add "extra-traits" for debugging.

[dev-dependencies]
# A dev-dependency cycle back onto the facade (legal for dev-dependencies, in
# contrast to normal ones) so the unit tests can assert the exact re-export
# paths under which consumers meet these macros; a facade rename or a dropped
# re-export fails this crate's tests instead of surfacing downstream.
bento.workspace = true
